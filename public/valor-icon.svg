<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Shield outline -->
  <path
    d="M240 20
       L420 90
       V270
       C420 390 340 460 240 500
       C140 460 60 390 60 270
       V90
       Z"
    fill="none"
    stroke="#c22a2a"
    stroke-width="10"
    stroke-linejoin="round"
    transform="translate(0,-20)"
  />

  <!-- Inner "V" blade, doubling as an upward arrow (rising / courage) -->
  <path
    d="M150 140
       L240 380
       L330 140
       L280 140
       L240 260
       L200 140
       Z"
    fill="#c22a2a"
    transform="translate(0,-20)"
  />

  <!-- Small accent line beneath the point, like a hilt / base -->
  <rect x="205" y="392" width="70" height="10" fill="#c22a2a" transform="translate(0,-20)" />
</svg>
